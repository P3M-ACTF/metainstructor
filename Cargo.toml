[workspace]
resolver = "2"
members = [
    "crates/meta-core",
    "crates/meta-explain",
    "crates/metapeek-cli",
    "crates/metapeek-web",
]
default-members = [
    "crates/meta-core",
    "crates/meta-explain",
    "crates/metapeek-cli",
    "crates/metapeek-web",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/P3M-ACTF/metapeek"
authors = ["MetaPeek Contributors"]
rust-version = "1.89"
description = "Local, exhaustive metadata analysis — educational and private by default."

[workspace.dependencies]
meta-core = { path = "crates/meta-core", version = "0.2.2" }
meta-explain = { path = "crates/meta-explain", version = "0.2.2" }
metapeek-web = { path = "crates/metapeek-web", version = "0.2.2" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "time"] }
