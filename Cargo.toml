[workspace]
resolver = "2"
members = [
    "crates/meta-explain",
    "crates/metainstructor-cli",
    "crates/metainstructor-web",
]
default-members = [
    "crates/meta-explain",
    "crates/metainstructor-cli",
    "crates/metainstructor-web",
]

[workspace.package]
version = "0.3.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/P3M-ACTF/metainstructor"
authors = ["MetaInstructor Contributors"]
rust-version = "1.89"
description = "Educational metadata viewer (web UI). Formerly MetaPeek."

[workspace.dependencies]
# Pinned MetaDissect tag. Local umbrella overrides via [patch] below.
metadissect = { git = "https://github.com/P3M-ACTF/metadissect", tag = "v0.11.2" }
meta-ui = { git = "https://github.com/P3M-ACTF/metadissect", tag = "v0.11.2" }
meta-explain = { path = "crates/meta-explain", version = "0.3.8" }
metainstructor-web = { path = "crates/metainstructor-web", version = "0.3.8" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "time"] }

# Local umbrella: override the git tag with the sibling checkout.
# Isolated clone without ../metadissect: comment out this [patch] block.
[patch."https://github.com/P3M-ACTF/metadissect"]
metadissect = { path = "../metadissect/crates/metadissect" }
meta-ui = { path = "../metadissect/crates/meta-ui" }
