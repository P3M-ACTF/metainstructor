<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MetaPeek</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div>
      <h1>MetaPeek</h1>
      <p class="tag">Análisis local exhaustivo · sin lista blanca · sin Node</p>
    </div>
    <nav>
      <button data-tab="summary" class="active">Resumen</button>
      <button data-tab="all">Todos los campos</button>
      <button data-tab="map">Mapa</button>
      <button data-tab="timeline">Timeline</button>
    </nav>
  </header>

  <section class="intake">
    <div id="drop" class="drop">
      <strong>Arrastra un archivo</strong>
      <span>o pega una URL / HTML / JSON</span>
      <input type="file" id="file" />
    </div>
    <div class="row">
      <input type="url" id="url" placeholder="https://…" />
      <button id="fetch">Fetch local</button>
    </div>
    <textarea id="paste" rows="4" placeholder="Pega HTML o JSON…"></textarea>
    <div class="row">
      <button id="analyze-html">Analizar HTML</button>
      <button id="analyze-json">Analizar JSON</button>
      <button id="export-json">JSON</button>
      <button id="export-csv">CSV</button>
      <button id="export-md">Markdown</button>
    </div>
  </section>

  <p id="status" class="status"></p>

  <main>
    <section id="summary" class="panel active"></section>
    <section id="all" class="panel">
      <input type="search" id="search" placeholder="Buscar campos…" />
      <div id="fields"></div>
    </section>
    <section id="map" class="panel"></section>
    <section id="timeline" class="panel"></section>
  </main>

  <aside id="explain">
    <h2>¿Qué significa esto?</h2>
    <div id="explain-body">Selecciona un campo para ver el glosario.</div>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
