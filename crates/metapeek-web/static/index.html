<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MetaPeek</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div>
      <h1>MetaPeek</h1>
      <p class="tag">Análisis local exhaustivo · sin lista blanca · sin Node</p>
    </div>
    <nav role="tablist" aria-label="Vistas">
      <button type="button" role="tab" data-tab="summary" class="active" aria-selected="true" aria-controls="summary" id="tab-summary">Resumen</button>
      <button type="button" role="tab" data-tab="all" aria-selected="false" aria-controls="all" id="tab-all">Todos los campos</button>
      <button type="button" role="tab" data-tab="map" aria-selected="false" aria-controls="map" id="tab-map">Mapa</button>
      <button type="button" role="tab" data-tab="timeline" aria-selected="false" aria-controls="timeline" id="tab-timeline">Timeline</button>
    </nav>
  </header>

  <section class="intake">
    <div id="drop" class="drop">
      <strong>Arrastra un archivo</strong>
      <span>o pega una URL / HTML / JSON</span>
      <label class="visually-hidden" for="file">Archivo local</label>
      <input type="file" id="file" />
    </div>
    <div class="row">
      <label class="visually-hidden" for="url">URL pública</label>
      <input type="url" id="url" placeholder="https://…" />
      <button type="button" id="fetch">Fetch local</button>
    </div>
    <label class="visually-hidden" for="paste">HTML o JSON</label>
    <textarea id="paste" rows="4" placeholder="Pega HTML o JSON…"></textarea>
    <div class="row">
      <button type="button" id="analyze-html">Analizar HTML</button>
      <button type="button" id="analyze-json">Analizar JSON</button>
      <button type="button" id="export-json">JSON</button>
      <button type="button" id="export-csv">CSV</button>
      <button type="button" id="export-md">Markdown</button>
    </div>
  </section>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <main>
    <section id="summary" class="panel active" role="tabpanel" aria-labelledby="tab-summary"></section>
    <section id="all" class="panel" role="tabpanel" aria-labelledby="tab-all" hidden>
      <label class="visually-hidden" for="search">Buscar campos</label>
      <input type="search" id="search" placeholder="Buscar campos…" />
      <div id="fields"></div>
    </section>
    <section id="map" class="panel" role="tabpanel" aria-labelledby="tab-map" hidden></section>
    <section id="timeline" class="panel" role="tabpanel" aria-labelledby="tab-timeline" hidden></section>
  </main>

  <aside id="explain">
    <h2>¿Qué significa esto?</h2>
    <div id="explain-body">Selecciona un campo para ver el glosario.</div>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
