[package]
name = "metainstructor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MetaInstructor command-line interface (web UI by default)."

[[bin]]
name = "metainstructor"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["meta-ui/tui"]

[dependencies]
metadissect.workspace = true
meta-explain.workspace = true
meta-ui.workspace = true
metainstructor-web.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde_json.workspace = true
tokio.workspace = true
