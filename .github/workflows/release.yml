name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: metapeek.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: metapeek
            archive: tar
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: metapeek
            archive: tar
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: metapeek
            archive: tar
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: metapeek
            archive: tar
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: metapeek
            archive: tar
          - os: ubuntu-latest
            target: aarch64-linux-android
            bin: metapeek
            archive: tar
            android: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Native build
        if: ${{ !matrix.cross && !matrix.android }}
        run: cargo build --release --target ${{ matrix.target }} --bin metapeek
      - name: Cross build (Linux)
        if: ${{ matrix.cross }}
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cross build --release --target ${{ matrix.target }} --bin metapeek
      - name: Android / Termux aarch64
        if: ${{ matrix.android }}
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q ndk.zip
          export ANDROID_NDK_HOME="$PWD/android-ndk-r26d"
          export CC_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          rustup target add aarch64-linux-android
          cargo build --release --target aarch64-linux-android --bin metapeek
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "metapeek-${{ matrix.target }}"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" $out/
          Copy-Item README.md $out/
          Compress-Archive -Path $out -DestinationPath "$out.zip"
      - name: Pack (Unix)
        if: runner.os != 'Windows'
        run: |
          out="metapeek-${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$out/"
          cp README.md "$out/"
          tar -czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metapeek-${{ matrix.target }}
          path: |
            metapeek-*.zip
            metapeek-*.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/**
          generate_release_notes: true
